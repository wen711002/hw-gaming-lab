<!DOCTYPE html>

<head>

<title>HW Gaming Lab — Result</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg0:#0b0e17;--bg1:#111827;--bg2:#161d2e;--bg3:#1e2a40;--bg4:#243047;
  --text:#e8edf5;--text2:#8fa0bb;--text3:#4f6180;
  --border:#ffffff10;--border2:#ffffff20;--border3:#ffffff35;
  --blue:#4c9ef5;--blue-l:rgba(76,158,245,0.15);--blue-glow:rgba(76,158,245,0.25);
  --cyan:#00d4ff;--cyan-glow:rgba(0,212,255,0.2);
  --green:#00e5a0;--green-glow:rgba(0,229,160,0.2);
  --amber:#ffb347;--amber-glow:rgba(255,179,71,0.2);
  --red:#ff5c7a;--purple:#a855f7;--purple-glow:rgba(168,85,247,0.2);
  --font-head:'Rajdhani','Segoe UI',sans-serif;
  --font-body:'Noto Sans TC','Segoe UI',sans-serif;
  --font-mono:'Share Tech Mono','Courier New',monospace;
  --r4:4px;--r6:6px;--r8:8px;--r12:12px;
}
body{font-family:var(--font-body);background:var(--bg0);color:var(--text);min-height:100vh;font-size:17px;line-height:1.6;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(76,158,245,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(76,158,245,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% -20%,rgba(76,158,245,0.07),transparent);pointer-events:none;z-index:0;}

/* LAYOUT */
.outer{display:flex;min-height:100vh;position:relative;z-index:1;}
.main-content{flex:1;overflow-x:hidden;display:flex;flex-direction:column;}

/* SIDEBAR */
.sidebar{width:64px;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:6px;position:sticky;top:0;height:100vh;flex-shrink:0;}
.sidebar-logo{width:36px;height:36px;background:linear-gradient(135deg,var(--blue),var(--cyan));border-radius:var(--r8);display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;font-size:18px;color:#fff;margin-bottom:16px;box-shadow:0 0 16px var(--blue-glow);}
.nav-item{width:44px;height:44px;border-radius:var(--r8);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text3);transition:all 0.2s;font-size:20px;border:1px solid transparent;}
.nav-item:hover{background:var(--bg3);color:var(--text2);border-color:var(--border2);}
.nav-item.active{background:var(--blue-glow);color:var(--blue);border-color:rgba(76,158,245,0.4);box-shadow:0 0 12px var(--blue-glow);}
.nav-sep{width:32px;height:1px;background:var(--border);margin:8px 0;}
.nav-label{font-size:11px;color:var(--text3);letter-spacing:0.06em;text-align:center;margin-top:2px;font-family:var(--font-head);}
.sidebar-admin{margin-top:auto;padding-bottom:8px;}

/* HEADER */
.page-header{padding:32px 40px 24px;border-bottom:1px solid var(--border);}
.page-header h1{font-family:var(--font-head);font-size:32px;font-weight:700;letter-spacing:0.04em;color:var(--text);}
.page-header h1 span{color:var(--blue);}
.page-header p{color:var(--text2);margin-top:6px;font-size:16px;}

/* MODE SELECTOR */
.mode-wrap{padding:40px;display:flex;gap:24px;flex-wrap:wrap;}
.mode-card{flex:1;min-width:280px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r12);padding:32px;cursor:pointer;transition:all 0.25s;position:relative;overflow:hidden;}
.mode-card::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity 0.25s;}
.mode-card.single::before{background:linear-gradient(135deg,rgba(0,212,255,0.06),transparent);}
.mode-card.compare::before{background:linear-gradient(135deg,rgba(168,85,247,0.06),transparent);}
.mode-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.3);}
.mode-card.single:hover{border-color:rgba(0,212,255,0.5);}
.mode-card.compare:hover{border-color:rgba(168,85,247,0.5);}
.mode-card:hover::before{opacity:1;}
.mc-icon{font-size:40px;margin-bottom:16px;}
.mc-title{font-family:var(--font-head);font-size:22px;font-weight:700;letter-spacing:0.05em;margin-bottom:8px;}
.mode-card.single .mc-title{color:var(--cyan);}
.mode-card.compare .mc-title{color:var(--purple);}
.mc-desc{color:var(--text2);font-size:15px;line-height:1.7;}
.mc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;}
.mc-tag{padding:3px 10px;border-radius:20px;font-size:13px;font-family:var(--font-mono);}
.mode-card.single .mc-tag{background:rgba(0,212,255,0.1);color:var(--cyan);border:1px solid rgba(0,212,255,0.3);}
.mode-card.compare .mc-tag{background:rgba(168,85,247,0.1);color:var(--purple);border:1px solid rgba(168,85,247,0.3);}

/* PANELS */
.panel-wrap{padding:0 40px 40px;display:none;}
.panel-wrap.active{display:block;}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r6);color:var(--text2);cursor:pointer;font-size:15px;margin-bottom:24px;transition:all 0.2s;}
.back-btn:hover{color:var(--text);border-color:var(--border3);}

/* FILTER BOX */
.filter-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r12);padding:28px;margin-bottom:24px;}
.filter-box h3{font-family:var(--font-head);font-size:18px;font-weight:700;letter-spacing:0.06em;color:var(--text);margin-bottom:20px;}
.filter-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;}
.filter-field{display:flex;flex-direction:column;gap:6px;min-width:180px;flex:1;}
.filter-field label{font-size:13px;color:var(--text3);letter-spacing:0.06em;font-family:var(--font-head);}
.filter-field select,.filter-field input{padding:8px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r6);color:var(--text);font-size:15px;outline:none;transition:border-color 0.2s;}
.filter-field select:focus,.filter-field input:focus{border-color:var(--blue);}
.btn{padding:9px 20px;border-radius:var(--r6);font-size:15px;font-family:var(--font-head);font-weight:600;letter-spacing:0.06em;cursor:pointer;border:none;transition:all 0.2s;}
.btn-pri{background:linear-gradient(135deg,var(--blue),#1a6fd4);color:#fff;box-shadow:0 0 16px var(--blue-glow);}
.btn-pri:hover{box-shadow:0 0 24px var(--blue-glow);transform:translateY(-1px);}
.btn-sec{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);}
.btn-sec:hover{border-color:var(--border3);color:var(--text);}
.btn-grn{background:linear-gradient(135deg,var(--green),#00b37a);color:#000;}

/* RESULT FOLDER CARD */
.folder-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r12);padding:28px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.folder-card h3{font-family:var(--font-head);font-size:18px;font-weight:700;letter-spacing:0.05em;color:var(--text);margin-bottom:6px;}
.folder-card p{color:var(--text2);font-size:14px;font-family:var(--font-mono);word-break:break-all;}

/* LOG LIST */
.log-list{display:flex;flex-direction:column;gap:10px;}
.log-item{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r8);padding:16px 20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;}
.log-item .li-main{flex:1;min-width:240px;}
.log-item .li-meta{font-size:13px;color:var(--text3);font-family:var(--font-mono);margin-bottom:4px;}
.log-item .li-note{color:var(--text);font-size:15px;white-space:pre-wrap;}

/* EMPTY / LOADING */
.empty-state{text-align:center;padding:60px 20px;color:var(--text3);}
.empty-state .ei{font-size:48px;margin-bottom:16px;}
.empty-state p{font-size:16px;}
.loading-bar{text-align:center;padding:40px;color:var(--text3);font-family:var(--font-mono);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:0.5;}50%{opacity:1;}}
</style>
</head>
<body>
<div id="pw-modal" style="position:fixed;inset:0;background:#0a0d14;z-index:9999;display:flex;align-items:center;justify-content:center;">
  <div style="background:#141824;border:1px solid rgba(0,212,255,0.3);border-radius:12px;padding:40px 48px;text-align:center;min-width:320px;">
    <div style="font-family:'Orbitron',sans-serif;font-size:20px;font-weight:700;color:#00d4ff;letter-spacing:0.1em;margin-bottom:8px;">HW GAMING LAB</div>
    <div style="color:rgba(255,255,255,0.5);font-size:14px;margin-bottom:28px;">請輸入存取密碼</div>
    <input id="pw-input" type="password" placeholder="Password" style="width:100%;padding:10px 14px;background:#1e2635;border:1px solid rgba(0,212,255,0.3);border-radius:6px;color:#fff;font-size:16px;text-align:center;letter-spacing:0.2em;outline:none;margin-bottom:12px;" onkeydown="if(event.key==='Enter')checkPW()"/>
    <div id="pw-err" style="color:#ff6b6b;font-size:13px;min-height:18px;margin-bottom:12px;"></div>
    <button onclick="checkPW()" style="width:100%;padding:10px;background:rgba(0,212,255,0.15);border:1px solid rgba(0,212,255,0.4);border-radius:6px;color:#00d4ff;font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.1em;cursor:pointer;">ENTER</button>
  </div>
</div>
<script>
function checkPW(){
  var v=document.getElementById('pw-input').value;
  if(v==='IECGL666666'){sessionStorage.setItem('siteAuth','1');document.getElementById('pw-modal').style.display='none';}
  else{document.getElementById('pw-err').textContent='密碼錯誤，請重新輸入';document.getElementById('pw-input').value='';document.getElementById('pw-input').focus();}
}
if(sessionStorage.getItem('siteAuth')==='1'){document.getElementById('pw-modal').style.display='none';}
else{document.getElementById('pw-input').focus();}
</script>
<div class="outer">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-logo">GL</div>
  <div style="text-align:center;">
    <div class="nav-item" title="Form" onclick="window.location.href='form.html'">📋</div>
    <div class="nav-label">Form</div>
  </div>
  <div class="nav-sep"></div>
  <div style="text-align:center;">
    <div class="nav-item active" title="Result">📊</div>
    <div class="nav-label">Result</div>
  </div>
  <div class="nav-sep"></div>
  <div style="text-align:center;">

    <div class="nav-label">Schedule</div>

  <div style="text-align:center;">
    <div class="nav-item" title="Admin" onclick="openAdmin()">🔧</div>

  </div>
  <div class="nav-sep"></div>
  <div class="sidebar-admin" style="text-align:center;">
    <div class="nav-item" title="使用說明" onclick="alert('使用說明 — 即將推出。')">📖</div>
    <div class="nav-label">Guide</div>

</div>

<!-- MAIN -->
<div class="main-content">

  <!-- HEADER -->
  <div class="page-header">
    <h1>Result <span>Viewer</span></h1>
    <p>查詢專案測試結果，或進行跨專案比對</p>
  </div>

  <!-- MODE SELECTOR -->
  <div class="mode-wrap" id="mode-wrap">
    <div class="mode-card single" onclick="enterMode('lookup')">
      <div class="mc-icon">📥</div>
      <div class="mc-title">整份 Result 下載</div>
      <div class="mc-desc">輸入專案代碼，查出該專案所有測試結果通知紀錄，並直接前往 SharePoint 對應資料夾下載完整結果。</div>
    </div>
    <div class="mode-card compare" onclick="enterMode('compare')">
      <div class="mc-icon">📊</div>
      <div class="mc-title">Result 比對</div>
      <div class="mc-desc">跨專案、跨 Phase、複測前後比對 — 詳細設計進行中。</div>
      <div class="mc-tags">
        <span class="mc-tag">即將推出</span>
      </div>
    </div>
  </div>

  <!-- LOOKUP / DOWNLOAD PANEL -->
  <div class="panel-wrap" id="panel-lookup">
    <button class="back-btn" onclick="backToMode()">← 返回選擇</button>
    <div class="filter-box">
      <h3>輸入專案代碼查詢</h3>
      <div class="filter-row">
        <div class="filter-field">
          <label>專案代碼（PROJECT CODE）</label>
          <input type="text" id="lookup-code" placeholder="例：G814JV" onkeydown="if(event.key==='Enter')runLookup()"/>
        </div>
        <div style="display:flex;align-items:flex-end;">
          <button class="btn btn-pri" onclick="runLookup()">🔍 查詢</button>
        </div>
      </div>
    </div>
    <div id="lookup-result-area">
      <div class="empty-state">
        <div class="ei">📥</div>
        <p>請輸入專案代碼後點擊「查詢」</p>
      </div>
    </div>
  </div>

  <!-- COMPARE PANEL (placeholder) -->
  <div class="panel-wrap" id="panel-compare">
    <button class="back-btn" onclick="backToMode()">← 返回選擇</button>
    <div class="empty-state">
      <div class="ei">📊</div>
      <p>Result 比對功能設計中，敬請期待。</p>
    </div>
  </div>

</div><!-- /main-content -->

<script>
// ── Mode switching ────────────────────────────────────────────────────────────
function enterMode(mode){
  document.getElementById('mode-wrap').style.display='none';
  ['lookup','compare'].forEach(function(m){
    var el=document.getElementById('panel-'+m);
    if(el){el.classList.remove('active');el.style.display='none';}
  });
  var panel=document.getElementById('panel-'+mode);
  if(panel){panel.style.display='block';panel.classList.add('active');}
}
function backToMode(){
  document.getElementById('mode-wrap').style.display='flex';
  ['lookup','compare'].forEach(function(m){
    var el=document.getElementById('panel-'+m);
    if(el){el.classList.remove('active');el.style.display='none';}
  });
}

// ── Result Lookup (by Project Code) ─────────────────────────────────────────
var PA_QUERY_RESULTS='https://default2ae41f0cacca40f19c6349475ff385.12.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/36652175c1ee4a4e98ef6708ec5d02f6/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=0zzT0ttR8TlQl5CC-vBOmIFobXO_LVhiYd1YCMbmA40';
var PA_GET_FILE='https://default2ae41f0cacca40f19c6349475ff385.12.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/30ae0af6532742de8324b0c1cab152d7/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=8hbfVKWko1G2kztMukuO9McyNqb5sYX8a9vPHosjmV0';
var SP_SITE='https://inventeccorp.sharepoint.com/sites/IEC1-HWGamingLab';

function fmtDt(raw){
  if(!raw)return'—';
  try{var d=new Date(raw),p=function(n){return n<10?'0'+n:String(n);};
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
  catch(e){return(raw+'').replace('T',' ').slice(0,16);}
}

function runLookup(){
  var code=document.getElementById('lookup-code').value.trim().toUpperCase();
  if(!code){alert('請輸入專案代碼。');return;}
  var area=document.getElementById('lookup-result-area');
  area.innerHTML='<div class="loading-bar">查詢中，請稍候...</div>';
  fetch(PA_QUERY_RESULTS,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(function(data){
    var items=data.value||(data.d&&data.d.results)||[];
    var matched=items.filter(function(i){return(i.Title||'').toUpperCase()===code;});
    matched.sort(function(a,b){
      var da=new Date(a.UploadedAt||a.Created||0),db=new Date(b.UploadedAt||b.Created||0);
      return db-da;
    });
    renderLookupResult(code,matched,area);
  })
  .catch(function(e){
    area.innerHTML='<div class="empty-state"><div class="ei">⚠️</div><p>查詢失敗：'+escH(e.message)+'</p></div>';
  });
}

function renderLookupResult(code,items,area){
  var folderUrl=(items[0]&&items[0].FileUrl)?items[0].FileUrl:SP_SITE+'/GameLabResultFiles/'+encodeURIComponent(code);
  var html='<div class="folder-card">';
  html+='<div><h3>📁 '+escH(code)+' — 完整結果資料夾</h3><p>'+escH(folderUrl)+'</p></div>';
  html+='<a class="btn btn-pri" href="'+escH(folderUrl)+'" target="_blank" rel="noopener">⬇ 前往 SharePoint 下載整份 Result</a>';
  html+='</div>';

  if(!items.length){
    html+='<div class="empty-state"><div class="ei">📭</div><p>此專案尚無完成通知紀錄，若已請實驗室人員確認檔案是否已放置於上方資料夾。</p></div>';
    area.innerHTML=html;
    return;
  }

  html+='<div class="log-list">';
  items.forEach(function(item){
    var note=escH(item.Note||'');
    var by=escH(item.Uploader||'—');
    var dt=fmtDt(item.UploadedAt);
    var fname=item.FileName||'';
    var isStatus=fname==='部份完成'||fname==='全部完成';
    var statusTag=isStatus?'<span style="font-size:13px;padding:1px 8px;border-radius:10px;margin-right:8px;'+(fname==='全部完成'?'background:rgba(0,229,160,0.15);color:var(--green);':'background:rgba(255,179,71,0.15);color:var(--amber);')+'">'+escH(fname)+'</span>':'';
    html+='<div class="log-item">';
    html+='<div class="li-main">';
    html+='<div class="li-meta">'+statusTag+dt+'　by '+by+(!isStatus&&fname?'　📎 '+escH(fname):'')+'</div>';
    if(note)html+='<div class="li-note">'+note+'</div>';
    html+='</div>';
    if(item.FileUrl){
      html+='<a class="btn btn-sec" href="'+escH(item.FileUrl)+'" target="_blank" rel="noopener">🔗 查看</a>';
    }
    html+='</div>';
  });
  html+='</div>';
  area.innerHTML=html;
}

// ── Admin ─────────────────────────────────────────────────────────────────
var _adminAuth=false;
function openAdmin(){
  if(_adminAuth){sessionStorage.setItem('adminAuth','1');window.location.href='form.html#admin';return;}
  var pw=prompt('🔒 後台管理\n請輸入密碼：');
  if(pw===null) return;
  if(pw==='GL#31#'){_adminAuth=true;sessionStorage.setItem('adminAuth','1');window.location.href='form.html#admin';}
  else{alert('❌ 密碼錯誤，請重新輸入。');}
}

// ── Helper ───────────────────────────────────────────────────────────────────
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
